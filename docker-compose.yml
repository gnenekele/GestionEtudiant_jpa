version: '3.8'
services:
  postgres:
    image: postgres
    environment:
      POSTGRES_DB: urban_si
      POSTGRES_USER: urbansidev
      POSTGRES_PASSWORD: 3xDaVs
    ports:
      - "5432:5432"
  springboot-app:
    build: .
    container_name: tresor_container_postgre
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8087:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gestionEtudiant
      SPRING_DATASOURCE_USERNAME: urbansidev
      SPRING_DATASOURCE_PASSWORD: 3xDaVs
  loki:
    image: grafana/loki:2.9.3
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      - loki
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
